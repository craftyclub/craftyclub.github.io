<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crafty Club · Workshops a Torino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1FF; --surface:#FFFFFF; --ink:#2A1440; --ink-soft:#6B5A80; --line:#E4DAF5;
  --pink:#FF5FA2; --sun:#FFCF3D; --mint:#2FC79B; --cobalt:#4A5BFF; --peach:#FF9A6B; --lilac:#B79BFF;
  --chip:#FFFFFF; --sheet:#FFFFFF; --overlay:rgba(42,20,64,.45);
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A0F27; --surface:#26173A; --ink:#F7EEFF; --ink-soft:#B8A6CF; --line:#3B2754;
    --chip:#2E1D45; --sheet:#24163A; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0F27; --surface:#26173A; --ink:#F7EEFF; --ink-soft:#B8A6CF; --line:#3B2754;
  --chip:#2E1D45; --sheet:#24163A; --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:12px}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gr) 0 var(--gl)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.02em;font-stretch:85%;white-space:nowrap;min-width:0}
.logo svg{width:30px;height:30px;flex:none}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center;padding:0;border:2px solid var(--ink);background:var(--surface);border-radius:999px;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:var(--pink);color:#fff}
.icon-btn .count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;border:2px solid var(--bg);font-size:11px;font-weight:700;line-height:14px;text-align:center}
.icon-btn[aria-pressed="true"] .count{background:var(--ink);color:var(--bg)}
.city{display:flex;align-items:center;gap:6px;height:38px;border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:0 12px 0 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.city svg{width:12px;height:12px;flex:none}
@media (max-width:360px){.logo{font-size:19px}.logo svg{width:26px;height:26px}}

/* hero */
.hero{position:relative;padding:18px 0 8px}
.hero h1{font-size:clamp(28px,8vw,56px);line-height:.95;margin:0 0 14px;font-weight:800;font-stretch:80%;letter-spacing:-.03em}
.hero h1 span{display:block;white-space:nowrap}
.sticker{position:absolute;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);color:#2A1440;white-space:nowrap}
.s1{background:var(--sun);right:2px;top:20px;transform:rotate(8deg)}
.s2{background:var(--mint);right:30px;top:72px;transform:rotate(-6deg)}
.s3{background:var(--pink);right:0;top:122px;transform:rotate(4deg)}
@media (max-width:420px){.s2,.s3{display:none}.s1{top:4px}}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink)}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:16px;min-width:0}
.search svg{flex:none}
.searchrow{display:flex;gap:10px;align-items:stretch}
.searchrow .search{flex:1;min-width:0}
.calbtn{flex:none;width:52px;padding:0;display:grid;place-items:center;border:2px solid var(--ink);background:var(--sun);color:#2A1440;border-radius:18px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cal-head h3{margin:0}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:38px;height:38px;padding:0;display:grid;place-items:center;border:2px solid var(--ink);background:var(--surface);border-radius:999px;cursor:pointer}
.cal-nav button:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;touch-action:pan-y}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);padding:2px 0 4px}
.cal-day{min-height:52px;padding:5px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid transparent;border-radius:12px;background:none;font-size:14px;font-weight:600;color:var(--ink);min-width:0}
.cal-day:disabled{cursor:default}
.cal-day.has{background:var(--bg);border-color:var(--line);cursor:pointer}
.cal-day.has:hover{border-color:var(--ink)}
.cal-day.past{opacity:.4}
.cal-day .n{min-width:24px;line-height:22px;border-radius:999px}
.cal-day.today .n{background:var(--ink);color:var(--bg)}
.cal-day .ems{display:flex;align-items:center;justify-content:center;gap:1px;font-size:12px;line-height:1}
.cal-day .more{font-size:10px;font-weight:700;color:var(--ink-soft)}
.cal-hint{margin:12px 0 0;color:var(--ink-soft);font-size:14px;text-align:center}
.daylist{display:grid;gap:12px;margin-top:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;margin-bottom:8px;font-weight:700;color:var(--ink-soft);cursor:pointer}

/* categories */
.rail{display:flex;gap:10px;overflow-x:auto;padding:18px calc(var(--gr) - 6px) 6px calc(var(--gl) - 6px);margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));scroll-padding-inline:calc(var(--gl) - 6px) calc(var(--gr) - 6px);scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.cat{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;background:none;border:0;cursor:pointer;padding:0}
.cat .blob{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;font-size:30px;border:2px solid transparent;transition:transform .15s}
.cat > span{font-size:12px;font-weight:600;line-height:1.15;text-align:center}
.ci{display:inline-block;flex:none;line-height:0}
.ci svg,.ci img{width:100%;height:100%;display:block}
.cat .blob .ci{width:42px;height:42px}
.ticket.photo{background-size:cover;background-position:center;color:#fff}
.ticket.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(42,20,64,.28),rgba(42,20,64,.58))}
.ticket.photo > *{position:relative}
.ticket.photo .wd,.ticket.photo .d,.ticket.photo .m,.ticket.photo .requested{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.chip-cat .ci{width:18px;height:18px}
.cal-day .ci{width:14px;height:14px}
.cat[aria-pressed="true"] .blob{border-color:var(--ink);transform:rotate(-6deg) scale(1.05);box-shadow:3px 3px 0 var(--ink)}

/* quick filters */
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px var(--gr) 12px var(--gl);margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.filters{border-color:var(--ink);display:flex;align-items:center;gap:6px}
.pill.reset{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.reset[hidden]{display:none}
.pill .count{background:var(--pink);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}

/* list */
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
.listhead h2{margin:0;font-size:19px;font-stretch:85%;letter-spacing:-.01em}
.listhead small{color:var(--ink-soft);font-size:14px}
.cards{display:grid;gap:14px 12px;grid-template-columns:1fr}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{display:flex;background:var(--surface);border-radius:20px;overflow:hidden;border:0;cursor:pointer;text-align:left;padding:0;width:100%}
.ticket{flex:none;width:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#2A1440;position:relative;padding:12px 0}
.ticket::after{content:"";position:absolute;right:-1px;top:10px;bottom:10px;border-right:2px dashed rgba(42,20,64,.25)}
.ticket.photo::after{border-right-color:rgba(255,255,255,.55)}
.ticket .wd{font-size:11px;font-weight:600}
.ticket .d{font-size:29px;font-weight:800;line-height:1;font-stretch:80%}
.ticket .m{font-size:12px;font-weight:700}
.ticket .requested{display:block;width:100%;padding:0 6px;font-size:12px;font-weight:800;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.ticket .em{font-size:22px;margin-top:6px}
.body{padding:11px 12px 10px 13px;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.body h3{margin:0;font-size:15.5px;line-height:1.2;font-weight:700}
.meta{color:var(--ink-soft);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.price{font-weight:800;font-size:14.5px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg)}
.badge.low{background:var(--sun);color:#2A1440}
.badge.out{background:var(--line);color:var(--ink-soft)}
.heart{margin-left:auto;background:none;border:0;padding:6px;cursor:pointer;font-size:20px;line-height:1}
.bar-t{display:inline-block;width:4px;height:14px;border-radius:2px;margin-right:7px;vertical-align:-1px;background:var(--cb)}
.empty{text-align:center;padding:40px 18px;color:var(--ink-soft)}
.funny{grid-column:1/-1;padding:16px 18px;border-radius:18px;background:var(--sun);color:#2A1440;font-size:14px;line-height:1.4}
.funny strong{display:block;font-size:16px;margin-bottom:4px}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty button{margin-top:12px}

/* organizer band */
.org{margin:34px 0 10px;background:var(--cobalt);color:#fff;border-radius:28px;padding:24px 22px;position:relative;overflow:hidden}
.org h2{margin:0 0 6px;font-size:26px;font-stretch:80%;line-height:1.05;max-width:16ch}
.org p{margin:0 0 16px;opacity:.9;max-width:36ch}
.btn{border:2px solid var(--ink);background:var(--sun);color:#2A1440;font-weight:700;padding:12px 18px;border-radius:14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.org .btn{border-color:#2A1440;box-shadow:3px 3px 0 #2A1440}
.org svg{position:absolute;right:-20px;bottom:-24px;width:150px;opacity:.9}
footer{color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:none}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.cat .blob{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px;position:sticky;top:4px;z-index:2}
.grab::after{content:"";position:absolute;inset:-14px -40px}
.sheet h3{margin:0 0 4px;font-size:21px;font-stretch:85%;line-height:1.1}
.sheet h4{margin:20px 0 10px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sheet .actions{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:0;background:var(--sheet);padding-top:10px}
.ghost{background:none;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}
.actions .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}
.detail .cover{position:relative;display:block;width:100%;height:min(54vh,460px);margin:2px 0 14px;padding:0;border:0;border-radius:18px;overflow:hidden;background:#1A0F27;cursor:pointer}
.detail .cover .bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(20px) brightness(.65);transform:scale(1.05)}
.detail .cover img{position:relative;display:block;width:100%;height:100%;object-fit:contain}.chip-cat{display:inline-flex;align-items:center;gap:6px;margin:2px 0 8px;padding:4px 11px 4px 7px;border:1.5px solid var(--cb);border-radius:999px;font-size:13px;font-weight:700;color:#2A1440}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0}
.detail dt{color:var(--ink-soft);font-size:13px}
.detail dd{margin:0;font-weight:600;font-size:14.5px}
.detail p{margin:0;color:var(--ink);font-size:14.5px}
.detail .btn{display:block;text-align:center;text-decoration:none;margin-top:18px}
.notice{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:16px;color:var(--ink-soft);font-size:14px}
/* desktop: tutta la larghezza, testi e schede più compatti */
@media (min-width:900px){
  :root{--gl:max(32px,env(safe-area-inset-left,0px)); --gr:max(32px,env(safe-area-inset-right,0px))}
  .wrap{max-width:960px}
  body{font-size:15px}
  .logo{font-size:20px}
  .hero{padding:10px 0 4px}
  .hero h1{font-size:clamp(34px,3.6vw,50px);margin-bottom:14px}
  .hero h1 span{display:inline}
  .hero h1 span+span::before{content:" "}
  .searchrow{max-width:720px}
  .search{padding:10px 14px;border-radius:16px}
  .search input{font-size:15px}
  .calbtn{width:46px;border-radius:16px}
  .rail{padding-left:calc(var(--gl) - 10px);scroll-padding-inline:calc(var(--gl) - 10px) var(--gr)}
  .cat{width:74px}
  .cat > span{white-space:nowrap}
  .cat .blob{width:54px;height:54px;border-radius:18px}
  .cat .blob .ci{width:34px;height:34px}
  .cat > span{font-size:12px}
  .pill{padding:6px 12px;font-size:13px}
  .listhead{margin:10px 0 8px}
  .listhead h2{font-size:19px}
  .listhead small{font-size:13px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{border-radius:16px}
  .ticket{width:92px;padding:8px 0}
  .ticket::after{top:8px;bottom:8px}
  .ticket .wd{font-size:11px}
  .ticket .d{font-size:24px}
  .ticket .m{font-size:11px}
  .ticket .requested{font-size:11px;padding:0 4px}
  .body{padding:10px 10px 8px 12px;gap:2px}
  .body h3{font-size:15px;line-height:1.2}
  .meta{font-size:12.5px}
  .row{margin-top:4px}
  .price{font-size:14px}
  .badge{font-size:11px}
  .heart{font-size:17px;padding:4px}
  .org{padding:20px 22px;border-radius:22px}
  .org h2{font-size:22px;max-width:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="cc-half" clipPathUnits="userSpaceOnUse"><rect x="256" y="0" width="256" height="512"/></clipPath></defs></svg>
<header class="top">
  <div class="wrap topbar">
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L20 26.6l-9.3 4.9 1.8-10.3L5 13.9l10.4-1.5z" fill="#FF5FA2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
      Crafty Club
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="savedBtn" type="button" aria-pressed="false" aria-label="Salvati">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
        <span class="count" id="savedCount" hidden>0</span>
      </button>
      <button class="city" id="regionBtn" type="button"><span id="regionLabel">Torino</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1><span>Cosa facciamo</span><span>questa settimana?</span></h1>
    <div class="searchrow">
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cerca un workshop o un luogo" autocomplete="off">
      </label>
      <button class="calbtn" id="calBtn" type="button" aria-label="Calendario dei workshop">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14.5" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </section>

  <div class="rail" id="cats" role="group" aria-label="Categorie"></div>

  <div class="quick" role="group" aria-label="Filtri rapidi">
    <button class="pill reset" id="resetAll" type="button" hidden aria-label="Azzera tutti i filtri">✕ Azzera</button>
    <button class="pill filters" id="openFilters" type="button">Filtri <span class="count" id="fcount" hidden>0</span></button>
    <button class="pill" data-when="today" aria-pressed="false" type="button">Stasera</button>
    <button class="pill" data-when="weekend" aria-pressed="false" type="button">Questo weekend</button>
    <button class="pill" data-quick="cheap" aria-pressed="false" type="button">Sotto 30 €</button>
  </div>

  <div class="listhead">
    <h2 id="listTitle">In arrivo a Torino</h2>
    <small id="listCount"></small>
  </div>
  <div class="cards" id="cards"></div>

  <section class="org" id="org">
    <h2>Organizzi workshop a Torino?</h2>
    <p>Pubblicali qui gratis e fatti trovare da chi cerca qualcosa di bello da fare.</p>
    <button class="btn" type="button" id="orgBtn">Pubblica un workshop</button>
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="44" fill="#FFCF3D"/><path d="M30 64c10-18 24-26 40-22s22 18 18 30" fill="none" stroke="#2A1440" stroke-width="5" stroke-linecap="round"/><circle cx="48" cy="52" r="5" fill="#2A1440"/><circle cx="74" cy="52" r="5" fill="#2A1440"/></svg>
  </section>
  <footer>Crafty Club · Torino</footer>
</main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<script>
const CATS = [
  {id:"ceramica", label:"Ceramica", em:"🏺", c:"#FFE2CF", b:"#FF9029"},
  {id:"pittura", label:"Pittura", em:"🎨", c:"#E7DEFF", b:"#9160F0"},
  {id:"fiori", label:"Fiori", em:"🌸", c:"#E2F5D8", b:"#5DBB63"},

function catIcon(id){
  const span=document.createElement("span"); span.className="ci"; span.setAttribute("aria-hidden","true");
  if(ICON_IMG[id]){ span.append(el("img",{src:ICON_IMG[id],alt:""})); return span; }
  const parts=ICONS[id]||ICONS.altro;
  const layer=k=>parts.map(p=>p[0].replace(/%c/g,p[k])).join("");
  span.innerHTML=`<svg viewBox="0 0 512 512">${layer(1)}<g clip-path="url(#cc-half)">${layer(2)}</g></svg>`;
  return span;
}
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];

const state = {all:[], loaded:false, dbOk:true, q:"", cats:[], when:"all", maxPrice:0, tab:"explore", saved:loadSaved(), region:loadRegion()};

function loadSaved(){ try{ return new Set(JSON.parse(localStorage.getItem("cc-saved")||"[]")); }catch(e){ return new Set(); } }
function persistSaved(){ try{ localStorage.setItem("cc-saved", JSON.stringify([...state.saved])); }catch(e){} }

const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const WD = ["dom","lun","mar","mer","gio","ven","sab"];
const MONTHS_LONG = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const WD_LONG = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function parseDate(s){ const [y,m,d]=(s||"").split("-").map(Number); return y? new Date(y,m-1,d):null; }
function today0(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function weekendRange(){ const t=today0(); const dow=t.getDay(); let sat=new Date(t); if(dow===0){ sat.setDate(t.getDate()-1);} else sat.setDate(t.getDate()+(6-dow)); const sun=new Date(sat); sun.setDate(sat.getDate()+1); return [dow===0?t:(dow===6?t:sat), sun]; }
function inWhen(d){
  const t=today0();
  if(!d) return false;
  if(state.when==="all") return d>=t;
  if(state.when==="today") return +d===+t;
  if(state.when==="week"){ const e=new Date(t); e.setDate(t.getDate()+7); return d>=t && d<=e; }
  if(state.when==="month"){ const e=new Date(t); e.setDate(t.getDate()+30); return d>=t && d<=e; }
  if(state.when==="weekend"){ const [a,b]=weekendRange(); return d>=a && d<=b; }
  return true;
}
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function filtered(){
  const q = norm(state.q);
  return state.all.filter(w=>{
    const d=parseDate(w.data);
    if(!d && w.su_prenotazione){ if(state.when!=="all") return false; }
    else if(!inWhen(d)) return false;
    if(state.tab==="saved" ? !state.saved.has(w.id) : !inRegion(w)) return false;
    if(state.cats.length && !state.cats.includes(catOf(w.categoria).id)) return false;
    // grandi scuole di cucina (campo solo_categoria): non nella lista generale, solo se la loro categoria è selezionata o si cerca
    if(w.solo_categoria && state.tab!=="saved" && !q && !state.cats.includes(catOf(w.categoria).id)) return false;
    if(state.maxPrice && !(Number(w.prezzo)<=state.maxPrice)) return false;
    if(q){ const hay=norm([w.titolo,w.organizzatore,w.zona,w.descrizione,catOf(w.categoria).label].join(" ")); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=> ((a.data||"9999")+(a.ora_inizio||"")).localeCompare((b.data||"9999")+(b.ora_inizio||"")));
}

function el(tag, attrs={}, ...kids){ const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else if(v!==false && v!=null) n.setAttribute(k,v===true?"":v); } for(const k of kids.flat()){ if(k==null) continue; n.append(k.nodeType?k:document.createTextNode(k)); } return n; }

function isUpcoming(w){ const d=parseDate(w.data); return d ? d>=today0() : !!w.su_prenotazione; }
function activeCats(){
  const ids=new Set();
  state.all.forEach(w=>{ if(isUpcoming(w) && (state.tab==="saved" ? state.saved.has(w.id) : inRegion(w))) ids.add(catOf(w.categoria).id); });
  return ids;
}
function renderCats(){
  const rail=document.getElementById("cats"); rail.innerHTML="";
  const ids=activeCats();
  state.cats = state.cats.filter(id=>ids.has(id));
  rail.hidden=!ids.size;
  CATS.filter(c=>ids.has(c.id)).forEach(c=>{
    rail.append(el("button",{class:"cat",type:"button","aria-pressed":String(state.cats.includes(c.id)),onclick:()=>{ const i=state.cats.indexOf(c.id); i>=0?state.cats.splice(i,1):state.cats.push(c.id); render(); }},
      el("div",{class:"blob",style:`background:${c.c}`},catIcon(c.id)), el("span",{},c.label)));
  });
}

function seatsBadge(w){
  const n=Number(w.posti_disponibili);
  if(w.posti_disponibili==null || w.posti_disponibili==="") return null;
  if(n<=0) return el("span",{class:"badge out"},"Esaurito");
  if(n<=3) return el("span",{class:"badge low"}, n===1?"Ultimo posto":`Ultimi ${n} posti`);
  return el("span",{class:"badge"},`${n} posti liberi`);
}
const euro = p => (p===0||p==="0") ? "Gratis" : (p!=null && p!=="" ? `${Number(p).toLocaleString("it-IT")} €` : "");
const priceLabel = w => (w.prezzo_da && w.prezzo ? "da " : "") + euro(w.prezzo);

// foto piccola (scheda) in img/eventi/, versione grande non ritagliata in img/eventi/grandi/
const fotoOf = w => w.foto && /^img\/eventi\/[\w.-]+\.(jpe?g|png|webp)$/i.test(w.foto) ? w.foto : null;
const fotoGrande = w => { const f=fotoOf(w); return f ? f.replace("img/eventi/","img/eventi/grandi/") : null; };


function card(w){
  const c=catOf(w.categoria), d=parseDate(w.data);
  const heart=el("button",{class:"heart",type:"button"});
  const paint=()=>{ const on=state.saved.has(w.id); heart.textContent=on?"♥":"♡"; heart.style.color=on?"var(--pink)":"var(--ink-soft)"; heart.setAttribute("aria-label",on?"Rimuovi dai salvati":"Salva"); };
  heart.addEventListener("click",e=>{ e.stopPropagation(); state.saved.has(w.id)?state.saved.delete(w.id):state.saved.add(w.id); persistSaved(); paint(); render(); });
  paint();
  const foto = fotoOf(w);
  const when=[w.ora_inizio, w.zona].filter(Boolean).join(" · ");
  return el("div",{class:"card",role:"button",tabindex:"0",style:`--cb:${c.b}`,onclick:()=>openDetail(w),onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetail(w);}}},
    el("div",{class:"ticket"+(foto?" photo":""),style:foto?`background-image:url('${foto}')`:`background:${c.c}`},
      d ? [el("span",{class:"wd"},WD[d.getDay()]), el("span",{class:"d"},String(d.getDate())), el("span",{class:"m"},MONTHS[d.getMonth()])] : el("span",{class:"requested"},"su prenotazione")),
    el("div",{class:"body"},
      el("h3",{}, el("span",{class:"bar-t",title:c.label,"aria-hidden":"true"}), w.titolo||"Workshop"),
      el("div",{class:"meta"}, when),
      w.organizzatore? el("div",{class:"meta"}, "con "+w.organizzatore):null,
      el("div",{class:"row"}, el("span",{class:"price"},priceLabel(w)), seatsBadge(w), heart))
  );
}

function renderHeader(){
  const r=regionById(state.region);
  document.getElementById("regionLabel").textContent=r.short;
  document.getElementById("regionBtn").setAttribute("aria-label",`Zona: ${r.label}. Cambia zona`);
  const sb=document.getElementById("savedBtn"), sc=document.getElementById("savedCount");
  sb.setAttribute("aria-pressed",String(state.tab==="saved"));
  sb.setAttribute("aria-label", state.tab==="saved" ? "Torna a tutti i workshop" : `Salvati (${state.saved.size})`);
  sc.hidden=!state.saved.size; sc.textContent=state.saved.size;
}

function render(){
  renderHeader(); renderCats();
  const box=document.getElementById("cards"); box.innerHTML="";
  const title=document.getElementById("listTitle"), count=document.getElementById("listCount");
  const where=regionById(state.region).where;
  title.textContent = state.tab==="saved" ? "I tuoi salvati" : ((state.cats.length===1 ? catOf(state.cats[0]).label : state.cats.length ? state.cats.map(id=>catOf(id).label).join(", ") : "In arrivo")+" "+where).trim();
  const active = (state.maxPrice?1:0)+(state.when!=="all"?1:0);
  const fc=document.getElementById("fcount"); fc.hidden=!active; fc.textContent=active;
  document.getElementById("resetAll").hidden = !(active || state.cats.length || state.q);
  document.querySelectorAll("[data-when]").forEach(b=>b.setAttribute("aria-pressed",String(state.when===b.dataset.when)));
  document.querySelector('[data-quick="cheap"]').setAttribute("aria-pressed",String(state.maxPrice===30));
  if(!state.dbOk){ count.textContent=""; box.append(el("div",{class:"notice"},"Apri questa pagina da claude.ai per vedere i workshop.")); return; }
  if(!state.loaded){ count.textContent=""; box.append(el("div",{class:"empty"},"Carico i workshop…")); return; }
  // easter egg: chi cerca "schifo" riceve una frase scherzosa e tutti i workshop (la ricerca viene ignorata)
  const funny = norm(state.q).includes("schifo");
  let list;
  if(funny){ const q=state.q; state.q=""; list=filtered(); state.q=q; }
  else list=filtered();
  count.textContent = list.length===1?"1 workshop":`${list.length} workshop`;
  if(funny) box.append(el("div",{class:"funny"},
    el("strong",{},"Anche se questa settimana vuoi fare schifo, almeno fallo in compagnia."),
    "Scegli uno dei workshop qui sotto: nessuno ti giudica, al massimo ti insegnano qualcosa."));
  if(!list.length){
    if(!state.all.length){ box.append(el("div",{class:"empty"}, el("strong",{},"Ancora nessun workshop"), "I primi arrivano a breve.")); return; }
    if(state.tab==="saved"){ box.append(el("div",{class:"empty"}, el("strong",{},"Non hai ancora salvato niente"), "Tocca il cuore su un workshop per ritrovarlo qui.")); return; }
    box.append(el("div",{class:"empty"}, el("strong",{},"Nessun workshop con questi filtri"), "Prova a togliere un filtro o a cambiare data.", el("br"), el("button",{class:"ghost",type:"button",onclick:resetFilters},"Azzera i filtri")));
    return;
  }
  list.forEach(w=>box.append(card(w)));
}

function resetFilters(){ Object.assign(state,{q:"",cats:[],when:"all",maxPrice:0}); document.getElementById("q").value=""; render(); }

/* sheets */
const sheet=document.getElementById("sheet"), overlay=document.getElementById("overlay");
let lastFocus=null;
function openSheet(content){ lastFocus=document.activeElement; sheet.innerHTML=""; sheet.append(el("div",{class:"grab"}), ...content); sheet.scrollTop=0; overlay.classList.add("open"); sheet.classList.add("open"); setTimeout(()=>{const f=sheet.querySelector("button, a, input"); f&&f.focus({preventScroll:true});},50); }
function closeSheet(){ overlay.classList.remove("open"); sheet.classList.remove("open"); lastFocus&&lastFocus.focus(); }
overlay.addEventListener("click",closeSheet);
// trascinando il pannello verso il basso si chiude (solo se il contenuto è già in cima)
let drag=null;
sheet.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){ drag=null; return; }
  drag={x0:e.touches[0].clientX, y0:e.touches[0].clientY, t0:Date.now(), dy:0, active:false, atTop:sheet.scrollTop<=0 || e.target.classList.contains("grab")};
},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(!drag || !drag.atTop) return;
  const dx=e.touches[0].clientX-drag.x0, dy=e.touches[0].clientY-drag.y0;
  if(!drag.active){
    if(dy>8 && dy>Math.abs(dx)){ drag.active=true; sheet.style.transition="none"; }
    else if(Math.abs(dx)>8 || dy<-8){ drag=null; return; }
    else return;
  }
  drag.dy=Math.max(0,dy); sheet.style.transform=`translateY(${drag.dy}px)`; e.preventDefault();
},{passive:false});
function endDrag(){
  if(!drag) return; const d=drag; drag=null; if(!d.active) return;
  sheet.style.transition=""; sheet.style.transform="";
  if(d.dy>100 || (d.dy>40 && d.dy/(Date.now()-d.t0)>0.5)) closeSheet();
}
sheet.addEventListener("touchend",endDrag);
sheet.addEventListener("touchcancel",endDrag);
// un tocco nello spazio vuoto in alto (maniglia, titolo, margini sopra i comandi) chiude il pannello
sheet.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest(".detail .cover")){ closeSheet(); return; }
  if(!(t===sheet || t.classList.contains("grab") || t.id==="sheetTitle" || t.tagName==="H4")) return;
  const first=sheet.querySelector("button, a, input, label");
  if(!first || e.clientY < first.getBoundingClientRect().top) closeSheet();

/* calendar */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
let calMonth = null;
function workshopsByDay(){
  const m = new Map();
  state.all.forEach(w=>{ const inCats = !state.cats.length || state.cats.includes(catOf(w.categoria).id); if(w.data && parseDate(w.data) && inRegion(w) && inCats && (!w.solo_categoria || state.cats.includes(catOf(w.categoria).id))){ (m.get(w.data)||m.set(w.data,[]).get(w.data)).push(w); } });
  m.forEach(l=>l.sort((a,b)=>(a.ora_inizio||"").localeCompare(b.ora_inizio||"")));
  return m;
}
function openCalendar(month){
  const byDay = workshopsByDay();
  const minM = monthStart(today0());
  const last = [...byDay.keys()].sort().pop();
  const maxM = last && parseDate(last) > minM ? monthStart(parseDate(last)) : minM;
  let m = month || calMonth || minM;
  if(m < minM) m = minM; if(m > maxM) m = maxM;
  calMonth = m;
  const shift = n => { const t = new Date(m.getFullYear(), m.getMonth()+n, 1); if(t>=minM && t<=maxM) openCalendar(t); };
  const t0 = +today0();
  const grid = el("div",{class:"cal-grid"}, ["lun","mar","mer","gio","ven","sab","dom"].map(x=>el("div",{class:"cal-wd","aria-hidden":"true"},x)));
  const lead = (m.getDay()+6)%7;
  for(let i=0;i<lead;i++) grid.append(el("div"));
  const days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  let monthCount = 0;
  for(let n=1;n<=days;n++){
    const d = new Date(m.getFullYear(), m.getMonth(), n), key = ymd(d), list = byDay.get(key)||[];
    monthCount += list.length;
    const cls = ["cal-day", list.length?"has":"", +d===t0?"today":"", +d<t0?"past":""].filter(Boolean).join(" ");
    const label = `${WD_LONG[d.getDay()]} ${n} ${MONTHS_LONG[m.getMonth()]}` + (list.length ? `: ${list.length===1?"1 workshop":list.length+" workshop"}` : "");
    grid.append(el("button",{class:cls,type:"button",disabled:!list.length,"aria-label":label,onclick:()=>openDay(d,list)},
      el("span",{class:"n"},String(n)),
      list.length ? el("span",{class:"ems","aria-hidden":"true"}, list.slice(0,2).map(w=>catIcon(catOf(w.categoria).id)), list.length>2 ? el("span",{class:"more"},`+${list.length-2}`) : null) : null));
  }
  let x0 = null;
  grid.addEventListener("touchstart",e=>{ x0 = e.touches[0].clientX; },{passive:true});
  grid.addEventListener("touchend",e=>{ if(x0==null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx)>50) shift(dx<0?1:-1); });
  const arrow = (dir,lbl,dis) => el("button",{type:"button","aria-label":lbl,disabled:dis,onclick:()=>shift(dir)},
    el("span",{"aria-hidden":"true",style:"font-size:18px;line-height:1"}, dir<0?"‹":"›"));
  const where = regionById(state.region).where;
  openSheet([
    el("div",{class:"cal-head"},
      el("h3",{id:"sheetTitle"}, `${MONTHS_LONG[m.getMonth()][0].toUpperCase()+MONTHS_LONG[m.getMonth()].slice(1)} ${m.getFullYear()}`),
      el("div",{class:"cal-nav"}, arrow(-1,"Mese precedente",+m<=+minM), arrow(1,"Mese successivo",+m>=+maxM))),
    grid,
    el("p",{class:"cal-hint"}, (monthCount ? `Tocca un giorno per vedere i workshop ${where}` : `Nessun workshop con data questo mese ${where}`).trim())
  ]);
}
function openDay(d, list){
  openSheet([
    el("button",{class:"back",type:"button",onclick:()=>openCalendar(calMonth)},"‹ Calendario"),
    el("h3",{id:"sheetTitle"}, `${WD_LONG[d.getDay()][0].toUpperCase()+WD_LONG[d.getDay()].slice(1)} ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}`),

    el("div",{class:"daylist"}, list.map(w=>card(w)))
  ]);
}
